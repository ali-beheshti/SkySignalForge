[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flat-sky-signal-painter"
version = "0.1.0"
description = "Flat-sky map painting tools for moving-lens, tSZ, source, and mask simulations"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pillow>=10.0",
]

[project.scripts]
sky-paint = "flat_sky_signal_painter.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
